# Anti-Scam Trainer — local and demo stack.
# Usage from repository root:
#   docker compose up --build
#
# Startup order: postgres becomes healthy -> migrate applies the schema and
# exits -> backend starts and reports readiness on /readyz.
#
# `docker compose down`     keeps the database volume (progress survives).
# `docker compose down -v`  removes it — that is the explicit full reset.

name: antiscam

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: antiscam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antiscam}
      POSTGRES_USER: ${POSTGRES_USER:-antiscam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - antiscam
    # Port 5432 is intentionally not published: the database is reachable only
    # from the compose network. Add a mapping locally if you need psql access.

  # Schema is applied once, before the API starts. The binary embeds the
  # migrations, so it can never drift from the code in the same image.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.25.12"
        GO_IMAGE_VARIANT: "alpine3.23"
        ALPINE_VERSION: "3.23.5"
    image: antiscam-backend:local
    container_name: antiscam-migrate
    init: true
    restart: "no"
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-antiscam}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-antiscam}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - antiscam

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.25.12"
        GO_IMAGE_VARIANT: "alpine3.23"
        ALPINE_VERSION: "3.23.5"
    image: antiscam-backend:local
    container_name: antiscam-backend
    init: true
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      STORAGE_DRIVER: "postgres"
      DATABASE_URL: "postgres://${POSTGRES_USER:-antiscam}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-antiscam}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      # A failed migration blocks the API: it must never serve requests
      # against a schema it does not expect.
      migrate:
        condition: service_completed_successfully
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Readiness, not liveness: the API is only healthy once the database
      # answers.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    networks:
      - antiscam

  # --- Future: frontend (React/Vite static + nginx) ---------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:80"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - antiscam

networks:
  antiscam:
    driver: bridge

volumes:
  postgres_data:
