# Render deployment: serve the SPA and proxy API requests to the public
# backend service. Clients still see one origin, so the anonymous HttpOnly
# profile cookie remains same-site.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  proxy_max_temp_file_size 0;

  upstream api {
    server antiscum-backend.onrender.com:443;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    proxy_ssl_server_name on;
    proxy_ssl_name antiscum-backend.onrender.com;

    location /api/ {
      proxy_pass https://api;
      proxy_http_version 1.1;
      proxy_set_header Host antiscum-backend.onrender.com;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
      proxy_pass https://api;
      proxy_set_header Host antiscum-backend.onrender.com;
    }

    location = /readyz {
      proxy_pass https://api;
      proxy_set_header Host antiscum-backend.onrender.com;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
