<sc-if value="{{ toast }}">
  <div
    role="status"
    aria-live="polite"
    style="position:fixed;right:22px;bottom:70px;z-index:90;display:flex;align-items:center;gap:12px;max-width:380px;padding:12px 14px;background:#0C1826;border:2px solid {{ toastBd }};box-shadow:4px 4px 0 rgba(0,0,0,.55);animation:slideIn 200ms ease-out both"
  >
    {{ toastIcon }}
    <span style="flex: 1; font-size: 19px; line-height: 1.3; color: #eaf4ff">{{ toastText }}</span>
    <button
      type="button"
      onClick="{{ closeToast }}"
      aria-label="Dismiss"
      style="
        width: 30px;
        height: 30px;
        background: none;
        border: none;
        color: #7a93ae;
        font-size: 19px;
        cursor: pointer;
      "
      style-hover="color:#F0524B"
    >
      ✕
    </button>
  </div>
</sc-if>
