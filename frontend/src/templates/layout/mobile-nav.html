<sc-if value="{{ isMobile }}">
  <nav
    aria-label="Main"
    style="
      position: sticky;
      bottom: 0;
      z-index: 50;
      display: flex;
      background: #050b14;
      border-top: 2px solid #14283e;
    "
  >
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
      <button
        type="button"
        onClick="{{ n.go }}"
        aria-current="{{ n.cur }}"
        style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 7px;min-height:56px;background:none;border:none;border-top:3px solid {{ n.bar }};color:{{ n.color }};font-family:'VT323',monospace;font-size:15px;letter-spacing:.06em;cursor:pointer"
      >
        {{ n.icon }}<span>{{ n.label }}</span>
      </button>
    </sc-for>
  </nav>
</sc-if>
