# Frontend and API share one origin: the SPA is served here and every API path
# is proxied to the backend container. The anonymous profile cookie therefore
# stays same-site and the browser needs no CORS grant.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The root filesystem is read-only, so proxied answers must stay in memory
  # instead of being spooled to a temporary file.
  proxy_max_temp_file_size 0;

  upstream api {
    server backend:8080;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API answers before any static rule: /api must never fall through to
    # the SPA fallback and return index.html with status 200.
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location = /readyz {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    # index.html must never be cached: it is the file that points at the
    # current bundle, and a stale copy would load a bundle that no longer exists.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths belong to the SPA, not to a 404 page.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
