name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -count=1 -race ./...

      - name: Coverage summary
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: backend
          args: --config=${{ github.workspace }}/.golangci.yaml --timeout=5m

  backend-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: antiscam_test
          POSTGRES_USER: antiscam_test
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antiscam_test -d antiscam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://antiscam_test:integration-only@127.0.0.1:5432/antiscam_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run PostgreSQL integration suite
        run: go test -count=1 -p 1 -tags=integration ./...

  docker:
    name: Docker Compose business smoke
    runs-on: ubuntu-latest
    needs: [backend, backend-integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build stack
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Run full business and restart smoke
        run: bash .github/scripts/smoke.sh

      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --volumes --remove-orphans
